version: "3.9"

networks:
  urlshortener-net:
    driver: bridge

services:
  urlshortener:
    image: cattlehorse/urlshortener:latest
    hostname: urlshortener
    container_name: urlshortener
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
    networks:
      - urlshortener-net

  frontend:
    image: cattlehorse/urlshortener-frontend:latest
    hostname: frontend
    container_name: frontend
    # environment: # 需要 next-runtime-env 库才能运行时指定环境变量，https://blog.innei.ren/nextjs-runtime-env-and-build-once-deploy-many
    #   NEXT_PUBLIC_API_URL: http://urlshortener:8080
    #   NEXT_PUBLIC_API_URL: http://nginx/api # 由nginx统一管理
    # 不对外暴露端口
    # ports:
    #   - "3000:3000"
    depends_on:
      - urlshortener
    networks:
      - urlshortener-net

  nginx:
    image: cattlehorse/urlshortener-nginx-uniapp:latest
    hostname: nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf # 挂载配置文件
    #   - frontend-dist:/usr/share/nginx/htm
    networks:
      - urlshortener-net

#   uniapp:
#     image: cattlehorse/urlshortener-uniapp:latest
#     hostname: uniapp
#     container_name: uniapp

  mysql:
    image: mysql:8.0
    hostname: mysql
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: urlshortener
      TZ: Asia/Shanghai
    # healthcheck:
    #   test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 10s
    privileged: true
    restart: unless-stopped
    networks:
      - urlshortener-net
    volumes:
      - mysql-data:/var/lib/mysql
  redis:
    image: redis/redis-stack-server:latest
    hostname: redis
    container_name: redis
    ports:
      - "6379:6379"
    # 该命令导致启动后不加载module
    # command: ["redis-server" , "--protected-mode", "no"]
    # 持久化并去除保护模式（只接受本地的连接）
    environment:
      REDIS_ARGS: "--save 10 1 --appendonly yes --protected-mode no"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    # healthcheck:
    #   test: ["CMD", "redis-cli", "ping"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 10s
    networks:
      - urlshortener-net

volumes:
  redis-data:
  mysql-data:

# 每个CPU核心一个工作线程
worker_processes auto;

events {
    # 每个工作线程最大 1024 连接
    worker_connections 1024;
}

http {
    include       mime.types;
    # 当无法通过mime.types找到文件类型时，默认使用 application/octet-stream 二进制流
    default_type  application/octet-stream;

    # sendfile() 系统调用用于进程间零拷贝传输文件
    sendfile   on;
    # 在 HTTP 请求的连接在空闲状态下保持 65 秒，以便后续请求复用相同连接（比proxy连接超时多5秒）
    keepalive_timeout  65;

    #只在存在 $http_upgrade 时设置 Connection: upgrade，否则应该使用 keep-alive。
    map $http_upgrade $connection_upgrade {
        default keep-alive;
        websocket upgrade;
    }

    server {
        listen       80;
        server_name  localhost; # 主域名

        # CORS 全局配置，允许前端跨域调用
        add_header 'Access-Control-Allow-Origin' http://localhost always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # nextjs
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # 保留客户端IP地址
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # 支持 WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
            # 超时设置
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
        location /_next/static {
            add_header Cache-Control "public, max-age=3600, immutable";
            proxy_pass http://frontend:3000/_next/static;
        }

        # uniapp 静态资源
        location /app/ {
            root  /app/uniapp/;
            index  index.html;
            # fallback策略
            try_files  $uri  $uri/  index.html;
        }

        # 为后端反向代理（重点是保留原header），转发api到后端
        location /api/ {
            # 处理 OPTIONS 请求：允许预检通过并返回正确的 CORS 响应头
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' http://localhost;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization';
                add_header 'Access-Control-Allow-Credentials' 'true';
                return 204;
            }
            # 注意尾斜杠，去掉 /api/ 前缀
            proxy_pass http://urlshortener:8080/;
            proxy_set_header Host $host;
            # 保留客户端IP地址
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # 支持 WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
            # 超时设置
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }

        # 静态文件缓存
        # todo: 处理服务端渲染js，防止缓存问题
        # location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        location ~* \.(css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 30d;
            add_header Cache-Control "public";
        }
    }
}
